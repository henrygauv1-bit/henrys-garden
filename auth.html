<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Henry's Garden — Account</title><style>body{font:16px system-ui,sans-serif;background:#f4f7f2;color:#18352b}main{max-width:480px;margin:8vh auto;background:white;padding:24px;border-radius:14px}input,button{display:block;width:100%;box-sizing:border-box;padding:12px;margin:12px 0}button{background:#225b3b;color:white;border:0;border-radius:8px}#status{white-space:pre-wrap}</style></head><body><main><h1>Henry's Garden account</h1><p id="status">Checking your invitation…</p><form id="form" hidden><label>Choose a password (12 characters minimum)<input id="password" type="password" minlength="12" required autocomplete="new-password"></label><button>Set password</button></form><p><a href="./">Return to garden</a></p></main><script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const client=createClient('https://rusipqvmxqehcztaszuv.supabase.co','sb_publishable__uZp5I17ZULKVpN0x2ZgOw_Tq286_C0');
const status=document.querySelector('#status'),form=document.querySelector('#form');
const {data,error}=await client.auth.getSession();
if(error){status.textContent=error.message;}else if(data.session){status.textContent='Invitation accepted. Set your password.';form.hidden=false;}else{status.textContent='No active invitation. Please use the latest invitation email. Expired links must be reissued.';}
form.addEventListener('submit',async event=>{event.preventDefault();const {error}=await client.auth.updateUser({password:document.querySelector('#password').value});if(error){status.textContent=error.message;}else{form.hidden=true;status.textContent='Password saved. Garden cloud synchronization is not enabled yet.';}});
</script></body></html>
