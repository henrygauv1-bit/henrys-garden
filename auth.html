<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Henry's Garden — Set Password</title><style>body{font:16px system-ui,sans-serif;background:#f4f7f2;color:#18352b}main{max-width:480px;margin:8vh auto;background:white;padding:24px;border-radius:14px}input,button{display:block;width:100%;box-sizing:border-box;padding:12px;margin:12px 0}button{background:#225b3b;color:white;border:0;border-radius:8px}#status{white-space:pre-wrap}</style></head><body><main><h1>Henry's Garden account</h1><p id="status">Checking your password-reset link…</p><form id="form" hidden><label>Choose a password (12 characters minimum)<input id="password" type="password" minlength="12" required autocomplete="new-password"></label><button>Set password</button></form><p><a href="./login.html">Go to sign in</a></p></main><script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const client=createClient('https://rusipqvmxqehcztaszuv.supabase.co','sb_publishable__uZp5I17ZULKVpN0x2ZgOw_Tq286_C0',{auth:{detectSessionInUrl:true}});
const status=document.querySelector('#status'),form=document.querySelector('#form');
let ready=false;
function showForm(){ready=true;status.textContent='Set your password below.';form.hidden=false;}
client.auth.onAuthStateChange((event,session)=>{if((event==='PASSWORD_RECOVERY'||event==='SIGNED_IN')&&session)showForm();});
const hash=new URLSearchParams(location.hash.slice(1));
const query=new URLSearchParams(location.search);
const linkError=hash.get('error_description')||query.get('error_description');
if(linkError){status.textContent=linkError;}
else{
 const {data,error}=await client.auth.getSession();
 if(error)status.textContent=error.message;
 else if(data.session)showForm();
 else if(!ready)status.textContent='No active password-reset session. Request a new recovery email after the redirect is configured.';
}
form.addEventListener('submit',async event=>{event.preventDefault();if(!ready)return;const password=document.querySelector('#password').value;const {error}=await client.auth.updateUser({password});if(error){status.textContent=error.message;}else{form.hidden=true;status.textContent='Password saved. You can now sign in. Garden cloud synchronization is not enabled yet.';}});
</script></body></html>
