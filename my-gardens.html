<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Henry's Garden — My Gardens</title><style>body{font:16px system-ui,sans-serif;background:#f4f7f2;color:#18352b}main{max-width:650px;margin:7vh auto;background:white;padding:24px;border-radius:14px}button{padding:12px;background:#225b3b;color:white;border:0;border-radius:8px}li{padding:8px}#status{white-space:pre-wrap}</style></head><body><main><h1>My Private Gardens</h1><p id="status">Checking account…</p><ul id="gardens"></ul><p><a href="./login.html">Account login</a> · <a href="./">Existing local garden</a></p><p>Existing browser garden records have not been uploaded or modified.</p></main><script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const client=createClient('https://rusipqvmxqehcztaszuv.supabase.co','sb_publishable__uZp5I17ZULKVpN0x2ZgOw_Tq286_C0');
const status=document.querySelector('#status'),list=document.querySelector('#gardens');
try {
const {data:{user},error:authError}=await client.auth.getUser();
if(authError||!user){status.textContent='Please sign in with your invited account first.';}
else {
const {data,error}=await client.from('gardens').select('id,name,created_at').order('created_at',{ascending:false});
if(error)throw error;
status.textContent=data.length?'Your accessible gardens:':'No cloud gardens yet. Your existing local records are still available on the main website.';
for(const garden of data){const li=document.createElement('li');li.textContent=garden.name;list.append(li);}
}
}catch(error){status.textContent='Could not load cloud gardens: '+error.message;}
</script></body></html>
