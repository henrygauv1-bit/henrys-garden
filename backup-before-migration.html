<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Henry's Garden — Backup</title><style>body{font:16px system-ui,sans-serif;background:#f4f7f2;color:#18352b}main{max-width:640px;margin:7vh auto;background:#fff;padding:24px;border-radius:12px}button{padding:12px 18px;background:#225b3b;color:white;border:0;border-radius:8px}p{line-height:1.5}</style></head><body><main><h1>Back up your garden before cloud migration</h1><p>This page makes a copy of your existing garden records. It does not upload, delete, or change any records.</p><p id="status">Checking browser storage…</p><button id="backup" disabled>Download garden backup</button><p><a href="./">Return to Henry's Garden</a></p></main><script>
const key='henrys-garden-v1',raw=localStorage.getItem(key),status=document.getElementById('status'),button=document.getElementById('backup');
if(raw===null){status.textContent='No garden records found in this browser. Open this page in the same browser and device you use for Henry’s Garden.';}
else {try{JSON.parse(raw);status.textContent='Garden records found. Save a backup before enabling cloud synchronization.';button.disabled=false;}catch(e){status.textContent='Garden data exists but is not valid JSON. Do not migrate until it is inspected.';}}
button.addEventListener('click',()=>{if(button.disabled)return;const data=JSON.stringify({format:'henrys-garden-local-backup',version:1,created_at:new Date().toISOString(),storage_key:key,raw_value:raw},null,2);const url=URL.createObjectURL(new Blob([data],{type:'application/json'}));const link=document.createElement('a');link.href=url;link.download='henrys-garden-backup-'+new Date().toISOString().slice(0,10)+'.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);});
</script></body></html>
