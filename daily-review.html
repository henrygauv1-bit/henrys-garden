<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Henry's Garden — Daily Review</title><style>body{font:16px system-ui;background:#f3f7f2;color:#173b2b;margin:0}header{background:#205d40;color:white;padding:20px}main{max-width:850px;margin:auto;padding:20px}.card{background:white;border-radius:14px;padding:20px;margin:14px 0}textarea{width:100%;min-height:150px;box-sizing:border-box;font:inherit;padding:12px}button{background:#205d40;color:white;border:0;border-radius:8px;padding:12px;margin:5px;cursor:pointer}li{margin:9px 0}a{color:#205d40}</style><header><h1>End-of-Day Garden Review</h1></header><main><p><a href="index.html">← Back to Henry's Garden</a></p><div class="card"><label for="report">Tell me what you accomplished today</label><textarea id="report" placeholder="Describe what you did, what remains unfinished, and any plant observations."></textarea><p><button onclick="startVoice()">🎤 Dictate report</button><button onclick="review()">Prepare review</button></p><small>Speech recognition depends on your browser. This preliminary version saves reviews only in this browser; it does not yet update the main task list.</small></div><div id="results" class="card" hidden><h2>Review before saving</h2><div id="summary"></div><button onclick="save()">Save journal entry locally</button></div><div class="card"><h2>Saved daily reports</h2><ul id="history"></ul></div></main><script>let draft='';const key='henrys-garden-daily-reviews-v1';function startVoice(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){alert('Voice dictation is not supported in this browser. You can use your keyboard microphone or type.');return}let r=new SR();r.lang='en-US';r.continuous=true;r.interimResults=false;r.onresult=e=>{for(let i=e.resultIndex;i<e.results.length;i++)if(e.results[i].isFinal)document.getElementById('report').value+=' '+e.results[i][0].transcript};r.start()}function review(){draft=document.getElementById('report').value.trim();if(!draft){alert('Enter a report first.');return}document.getElementById('summary').textContent=draft;document.getElementById('results').hidden=false}function save(){if(!draft)return;let rows=JSON.parse(localStorage.getItem(key)||'[]');rows.unshift({date:new Date().toISOString(),report:draft});localStorage.setItem(key,JSON.stringify(rows));document.getElementById('results').hidden=true;render()}function render(){let rows=JSON.parse(localStorage.getItem(key)||'[]');let list=document.getElementById('history');list.replaceChildren();rows.forEach(row=>{let li=document.createElement('li');li.textContent=new Date(row.date).toLocaleString()+': '+row.report;list.appendChild(li)})}render()</script></html>
